name: deploy to github pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: build
        run: npm run build
      - name: setup pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4